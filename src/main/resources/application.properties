spring.application.name=pokemon-battler

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/pokedex
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate - ändra inte databastabeller automatiskt
spring.jpa.hibernate.ddl-auto=validate

# MongoDB
spring.mongodb.uri=mongodb://localhost:27018/pokedex
spring.mongodb.database=pokedex

pokemon.file=${POKEMON_FILE}
pokemon.seed-file=${POKEMON_SEED_FILE}